[project]
name = "dip-software"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "CosmicVoidWalker", email = "152412909+CosmicVoidWalker@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "fastapi<0.113.0",
    "flet>=1.0.4",
    "flet-charts>=1.0.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pillow>=13.0.0",
]

[project.scripts]
dip-software = "dip_software:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
